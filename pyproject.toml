[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esgx"
version = "0.1.0"
description = "AI for ESG Reporting: extraction, validation, and taxonomy mapping."
authors = [{name="Research Group"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "PyYAML>=6.0.0",
    "jinja2>=3.1.0",
    "regex>=2023.0.0",
    "pytest>=7.0.0"
]
